<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173f5f">
    <title>VITAE Cold-Chain Operations</title>
    <link rel="stylesheet" href="styles.css?v=foundation-7">
  </head>
  <body>
    <main id="loginView" class="foundation-login" hidden>
      <section class="foundation-login-card" aria-labelledby="loginTitle">
        <div class="vitae-brand vitae-brand-login">
          <span class="vitae-brand-mark" aria-hidden="true">V</span>
          <div><strong>VITAE</strong><span>Cold-chain intelligence</span></div>
        </div>
        <div class="foundation-login-copy">
          <span class="foundation-eyebrow">Secure workspace</span>
          <h1 id="loginTitle">Welcome back</h1>
          <p>Sign in to open the workspace assigned to your role.</p>
        </div>
        <form id="loginForm" class="foundation-form">
          <label><span>Email or username</span><input name="username" autocomplete="username" required></label>
          <label><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
          <p id="loginError" class="foundation-error" role="alert" hidden></p>
          <button id="loginButton" class="foundation-primary" type="submit">Sign in</button>
        </form>
        <details class="demo-access">
          <summary>Academic MVP demo access</summary>
          <div class="demo-account-list">
            <span><strong>Admin</strong> admin / admin123</span>
            <span><strong>Organization</strong> organization / organization123</span>
            <span><strong>Driver</strong> driver / driver123</span>
            <span><strong>Support</strong> support / support123</span>
          </div>
        </details>
      </section>
    </main>

    <main id="deniedView" class="foundation-denied" hidden></main>
    <main id="roleView" hidden></main>

    <script>window.GOOGLE_MAPS_API_KEY = "";</script>
    <script src="services/shipmentApi.js?v=foundation-7"></script>
    <script src="services/v2MonitoringApi.js?v=foundation-7"></script>
    <script src="components/shipment/liveShipmentDashboard.js?v=foundation-7"></script>
    <script src="core/auth.js?v=foundation-7"></script>
    <script src="core/ui.js?v=foundation-7"></script>
    <script src="roles/admin.js?v=foundation-7"></script>
    <script src="roles/organization.js?v=foundation-7"></script>
    <script src="roles/driver.js?v=foundation-7"></script>
    <script src="roles/support.js?v=foundation-7"></script>
    <script src="app.js?v=foundation-7"></script>
  </body>
</html>
